AWSTemplateFormatVersion: '2010-09-09'
Description: BudgetClick storage bucket (all objects are client-side encrypted)

Parameters:
  BucketName:
    Type: String
    Description: Globally unique name, e.g. budgetclick-yourname-x7k2q9

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [https://budgetclick.com, https://liteed.com]
            AllowedMethods: [GET, PUT, DELETE, HEAD]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3000

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: BudgetClickPublicReadWrite
            Effect: Allow
            Principal: '*'
            Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
            Resource: !Sub '${Bucket.Arn}/*'
          - Sid: BudgetClickPublicList
            Effect: Allow
            Principal: '*'
            Action: s3:ListBucket
            Resource: !GetAtt Bucket.Arn

Outputs:
  StoragePath:
    Description: Paste this into BudgetClick
    Value: !Sub 'https://${Bucket}.s3.${AWS::Region}.amazonaws.com/'